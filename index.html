<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Плащания">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2341e0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Моите плащания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* VOICE: brisk, personal, private — amounts per payment, totals only behind the eye
   IDEA: a household payment book with a coloured tab for each kind of bill
   PICTURE: the scoreboard total, huge condensed figures, with month bars; tabs as cards
   COLOUR and TYPE: warm white, electric cobalt board, coral accent, one bright colour per kind; Barlow Condensed + Inter
   LAYOUT: home = total + group cards; group = its own board, add form, history, PDF */
:root{color-scheme:light dark;
--bg:light-dark(#f7f5f2,#0f1115);--card:light-dark(#ffffff,#191b22);--ink:light-dark(#14151a,#eef0f6);
--mute:light-dark(#6b6e7a,#9a9eab);--line:light-dark(#e6e3dd,#2a2d37);--red:light-dark(#ec4a24,#ff7a59);
--redsoft:light-dark(#ffe6de,#3b1f18);--board:light-dark(#2341e0,#1c2fae);--boardink:#ffffff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:14px 16px 96px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:10px}
.top h1{flex:1;font:700 24px/1.1 "Barlow Condensed",Inter,sans-serif;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{background:var(--card);color:var(--ink);border:1px solid var(--line);width:44px;min-height:44px;height:44px;padding:0;display:grid;place-items:center}
.back svg{width:22px;height:22px}
.pdf{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:44px;padding:0 14px;font-size:15px}
.num{font-family:"Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.board{background:var(--board);color:var(--boardink);border-radius:20px;padding:22px 22px 18px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--acc,var(--red))}
.board .lbl{font-size:14px;color:rgba(255,255,255,.75);position:relative}
.board .total{font-size:clamp(48px,14vw,76px);font-weight:700;line-height:1;margin:4px 0 14px;position:relative}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.75);position:relative}
.stats b{display:block;color:var(--boardink);font:700 26px/1.1 "Barlow Condensed",sans-serif}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;background:rgba(255,255,255,.25);border-radius:4px 4px 0 0;min-height:3px}
.bars div.cur i{background:#fff}
.bars span{font-size:11px;color:rgba(255,255,255,.7)}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.total.locked{letter-spacing:.08em;opacity:.9;pointer-events:none}
.eye{flex:none;width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.eye svg{width:26px;height:26px}
.eye.on{background:#fff;color:var(--board)}
.pin{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.pin.open{display:flex}
.pin form{margin:0;width:min(340px,100%);grid-template-columns:1fr;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pin h2{margin:0;font:700 22px/1.2 "Barlow Condensed",sans-serif}
.pin p{margin:0;color:var(--mute);font-size:14px}
.pin input{font:600 28px "Barlow Condensed",sans-serif;letter-spacing:.4em;text-align:center}
.sect{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.sect h2{margin:0;font:700 20px/1.2 "Barlow Condensed",sans-serif}
.link{background:transparent;color:var(--mute);min-height:40px;padding:0 4px;font-size:15px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{position:relative;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 5px 5px 9px;min-height:40px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card .no{color:var(--mute);font-weight:500;margin-right:3px}
.card .nm{font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sm{font:700 17px/1.1 "Barlow Condensed",sans-serif;margin-top:1px}
.card .mt{font-size:11px;line-height:1.2;color:var(--mute);font-weight:400;margin-top:auto}
.card.add{min-height:40px;border-style:dashed;align-items:center;justify-content:center;color:var(--mute);font-size:13px;padding-left:6px}
.card.add::before{display:none}
.card.all{grid-column:1/-1;min-height:40px;flex-direction:row;align-items:center;justify-content:space-between}
.card.all::before{background:var(--board)}
.card .x{position:absolute;top:6px;right:8px;color:var(--red);font-weight:700;font-size:12px}
.newkind{display:none;gap:8px;margin-top:10px}
.newkind.open{display:flex}
.newkind input{flex:1}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
label.full{grid-column:1/-1}
input,select{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.amt{position:relative}.amt input{padding-right:30px}.amt::after{content:"€";position:absolute;right:12px;bottom:12px;color:var(--mute)}
.btns{grid-column:1/-1;display:flex;gap:10px}
button{font:600 16px Inter,sans-serif;border:0;border-radius:12px;min-height:48px;padding:0 18px;cursor:pointer}
.primary{background:var(--red);color:#fff;flex:1}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.err{grid-column:1/-1;color:var(--red);font-size:14px;margin:0;display:none}
.month{margin-top:26px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.mhead h3{margin:0;font:700 20px/1.2 "Barlow Condensed",sans-serif;text-transform:capitalize}
.mhead .num{font-size:20px;font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.day{width:46px;text-align:center;line-height:1;border-left:4px solid var(--c);padding-left:4px}
.day b{display:block;font:700 26px "Barlow Condensed",sans-serif}
.day small{font-size:12px;color:var(--mute)}
.what b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.what .note:only-child{color:var(--ink);font-size:15px}
.right{display:flex;align-items:center;gap:2px}
.right .num{font-size:22px;font-weight:700;margin-right:4px}
.icon{background:transparent;color:var(--mute);min-height:44px;min-width:40px;padding:0;font-size:15px}
.icon.del.armed{background:var(--redsoft);color:var(--red);min-width:auto;padding:0 10px}
.empty-state{text-align:center;color:var(--mute);padding:40px 10px}
.status{font-size:13px;color:var(--mute);margin:10px 2px 0;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:transparent;color:var(--red);min-height:40px;padding:0 10px}
.editing{outline:2px solid var(--red)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card,li{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<main>
<div class="top">
  <button class="back" id="back" aria-label="Начален екран" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></button>
  <h1 id="title">Моите плащания</h1>
  <button class="pdf" id="pdf" hidden>PDF</button>
</div>

<section class="board" id="board" aria-label="Общо">
  <div class="lblrow"><div class="lbl" id="boardLbl">Общо платено</div>
    <button class="eye" id="eye" aria-label="Покажи общата сума"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="total num locked" id="total">•••• €</div>
  <div class="stats">
    <div><b class="num" id="count">0</b>плащания</div>
    <div id="mWrap" hidden><b class="num" id="month">0 €</b>този месец</div>
    <div id="aWrap" hidden><b class="num" id="avg">—</b>средно</div>
  </div>
  <div class="bars" id="bars" aria-hidden="true"></div>
</section>

<div id="home">
  <div class="sect"><h2>Видове</h2><button class="link" id="manage">Редактирай</button></div>
  <div class="grid" id="cards"></div>
  <div class="newkind" id="newkind">
    <input type="text" id="kName" maxlength="30" placeholder="Нов вид, напр. Газ">
    <button type="button" class="primary" id="kSave" style="flex:none">Добави</button>
    <button type="button" class="ghost" id="kCancel" style="flex:none" aria-label="Затвори">✕</button>
  </div>
</div>

<div id="detail" hidden>
  <form id="form" autocomplete="off">
    <label class="full" id="catWrap">Вид<select id="fCat"></select></label>
    <label>Дата<input type="date" id="fDate" required></label>
    <label class="amt">Сума<input type="text" id="fAmt" inputmode="decimal" placeholder="0,00" required></label>
    <label class="full">Основание<input type="text" id="fNote" maxlength="80" placeholder="напр. сметка за октомври"></label>
    <p class="err" id="err">Въведи сума, по-голяма от нула.</p>
    <div class="btns">
      <button type="button" class="ghost" id="cancel" hidden>Отказ</button>
      <button type="submit" class="primary" id="submit">Добави плащане</button>
    </div>
  </form>
  <div id="list"></div>
</div>
<p class="status" id="status">Зареждане…</p>
</main>
<div class="pin" id="pin" role="dialog" aria-modal="true" aria-labelledby="pinT">
  <form id="pinForm" autocomplete="off">
    <h2 id="pinT">Покажи общата сума</h2>
    <p id="pinFor">Въведи паролата.</p>
    <input type="password" id="pinIn" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="Парола">
    <p class="err" id="pinErr">Грешна парола.</p>
    <div class="btns"><button type="button" class="ghost" id="pinCancel">Отказ</button><button type="submit" class="primary">Покажи</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">Върни</button></div>

<script>
{
const $ = id => document.getElementById(id);
const eur = new Intl.NumberFormat('bg-BG',{style:'currency',currency:'EUR'});
const eur0 = new Intl.NumberFormat('bg-BG',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const monthFmt = new Intl.DateTimeFormat('bg-BG',{month:'long',year:'numeric'});
const monShort = new Intl.DateTimeFormat('bg-BG',{month:'short'});
const wdFmt = new Intl.DateTimeFormat('bg-BG',{weekday:'short'});
const LS = 'payments-v2', LSK = 'payments-kinds-v2';
const PALETTE = ['#ff5a36','#ffb020','#2f8cff','#7c5cff','#14b8a6','#ff4f9a','#84cc16','#06b6d4','#f97316','#6b6e7a'];
const OLD = {'#d9321c':'#ff5a36','#e8a317':'#ffb020','#2f7bd9':'#2f8cff','#1f9e8a':'#14b8a6','#8a4fd1':'#7c5cff','#d1478f':'#ff4f9a','#5b8a2f':'#84cc16','#c46a2b':'#f97316','#3c5a99':'#06b6d4','#7a7a72':'#6b6e7a'};
const DEFAULT_KINDS = [
  {id:'trainer',name:'Треньор',color:'#ff5a36'},{id:'power',name:'Ток',color:'#ffb020'},
  {id:'water',name:'Вода',color:'#2f8cff'},{id:'rent',name:'Наем',color:'#7c5cff'},
  {id:'net',name:'Интернет',color:'#14b8a6'},{id:'phone',name:'Телефон',color:'#ff4f9a'}];
const PIN = '3890';
let unlocked = false;
let items = [], kinds = DEFAULT_KINDS.slice(), view = 'home', db = null, col = null, kindsDoc = null, dl = null;
let mode = 'local', editId = null, undoItem = null, toastT = null, manage = false;

const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtD = s => s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4);
const parseAmt = s => { let t = String(s).replace(/[\s\u00a0€]/g,''); if(t.includes(',')) t = t.replace(/\./g,'').replace(',','.'); return /^\d+(\.\d+)?$/.test(t) ? Number(t) : NaN; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c) ? (OLD[c.toLowerCase()]||c) : '#6b6e7a';
const clean = x => ({ id:String(x.id), date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:today(), amount:Number(x.amount)||0,
  note:typeof x.note==='string'?x.note:'', kind:typeof x.kind==='string'&&x.kind?x.kind:'trainer', created:Number(x.created)||0 });
const kindOf = id => kinds.find(k=>k.id===id) || {id, name:'Друго', color:'#7a7a72'};
const sumOf = arr => arr.reduce((s,x)=>s+x.amount,0);
const byDate = (a,b)=> b.date.localeCompare(a.date) || b.created-a.created;
const shownItems = () => view==='home'||view==='all' ? items : items.filter(x=>x.kind===view);

function loadLocal(){
  try{ items = (JSON.parse(localStorage.getItem(LS))||[]).map(clean); }catch(e){ items = []; }
  try{ const k = JSON.parse(localStorage.getItem(LSK)); if(Array.isArray(k)&&k.length) kinds = k; }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(items)); localStorage.setItem(LSK, JSON.stringify(kinds)); }catch(e){} }

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace('#','');
  if(h==='vsichki') view='all';
  else if(h.startsWith('vid-') && kinds.some(k=>k.id===h.slice(4))) view=h.slice(4);
  else view='home';
  if(editId) { editId=null; $('form').reset(); }
  unlocked = false; manage = false; $('pin').classList.remove('open');
  resetForm(); window.scrollTo(0,0);
}
const go = v => { location.hash = v==='home' ? '' : v==='all' ? 'vsichki' : 'vid-'+v; };
window.addEventListener('hashchange', route);
$('back').addEventListener('click', ()=>go('home'));

/* ---------- rendering ---------- */
function renderBoard(){
  const shown = shownItems(), k = view==='home'||view==='all' ? null : kindOf(view);
  $('board').style.setProperty('--acc', k ? safeColor(k.color) : 'var(--red)');
  $('boardLbl').textContent = k ? 'Общо платено за ' + k.name.toLowerCase() : 'Общо платено · всички видове';
  const sum = sumOf(shown), curKey = today().slice(0,7);
  $('total').textContent = unlocked ? eur.format(sum) : '•••• €';
  $('total').classList.toggle('locked', !unlocked);
  $('eye').classList.toggle('on', unlocked);
  $('eye').setAttribute('aria-label', unlocked ? 'Скрий общата сума' : 'Покажи общата сума');
  $('count').textContent = shown.length;
  $('mWrap').hidden = $('aWrap').hidden = $('bars').hidden = !unlocked;
  $('month').textContent = eur0.format(sumOf(shown.filter(x=>x.date.startsWith(curKey))));
  $('avg').textContent = shown.length ? eur0.format(sum/shown.length) : '—';
  const now = new Date(), months = [];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    months.push({key,label:monShort.format(d).replace('.',''),v:sumOf(shown.filter(x=>x.date.startsWith(key)))}); }
  const max = Math.max(1,...months.map(m=>m.v));
  if(!unlocked){ $('bars').innerHTML=''; return; }
  $('bars').innerHTML = months.map(m=>`<div class="${m.key===curKey?'cur':''}"><i style="height:${Math.round(m.v/max*100)}%"></i><span>${esc(m.label)}</span></div>`).join('');
}

function renderHome(){
  const cards = kinds.map((k,ki)=>{
    const n = items.filter(x=>x.kind===k.id), last = [...n].sort(byDate)[0];
    const del = manage && !n.length ? '<span class="x" aria-hidden="true">✕</span>' : '';
    return `<button class="card" data-k="${esc(k.id)}" style="--c:${safeColor(k.color)}">${del}<span class="nm"><span class="no">${ki+1}.</span>${esc(k.name)}</span>
      ${k.id==='trainer' ? '' : `<span class="mt">${n.length ? n.length+' бр.' : '—'}</span>`}
      ${unlocked?`<span class="sm num">${esc(eur0.format(sumOf(n)))}</span>`:''}</button>`;
  }).join('');
  $('cards').innerHTML = cards + `<button class="card add" data-k="+new">+ Нов</button>
    <button class="card all" data-k="+all"><span class="nm">Всички плащания</span><span class="mt">${items.length} общо ›</span></button>`;
  $('manage').textContent = manage ? 'Готово' : 'Редактирай';
}

function renderDetail(){
  const k = view==='all' ? null : kindOf(view);
  const cur = $('fCat').value;
  $('fCat').innerHTML = kinds.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  $('fCat').value = editId && kinds.some(x=>x.id===cur) ? cur : k ? k.id : (kinds.some(x=>x.id===cur) ? cur : (kinds[0]||{}).id||'');
  $('catWrap').hidden = !!k && !editId;
  const sorted = shownItems().slice().sort(byDate);
  if(!sorted.length){ $('list').innerHTML = `<p class="empty-state">${k?'Още няма плащания за „'+esc(k.name)+'“. Добави първото отгоре.':'Още няма плащания.'}</p>`; return; }
  const groups = {};
  sorted.forEach(x=>{ (groups[x.date.slice(0,7)] ||= []).push(x); });
  $('list').innerHTML = Object.entries(groups).map(([mk,arr])=>{
    const name = monthFmt.format(parseD(mk+'-01')).replace(' г.','');
    return `<section class="month"><div class="mhead"><h3>${esc(name)}</h3>${unlocked?`<span class="num">${esc(eur.format(sumOf(arr)))}</span>`:''}</div><ul>${arr.map(x=>{
      const d = parseD(x.date), kk = kindOf(x.kind);
      const head = k ? '' : `<b>${esc(kk.name)}</b>`;
      const note = x.note ? `<span class="note">${esc(x.note)}</span>` : (k ? '<span class="note" style="opacity:.6">без основание</span>' : '');
      return `<li class="${x.id===editId?'editing':''}" style="--c:${safeColor(kk.color)}"><div class="day"><b>${d.getDate()}</b><small>${esc(wdFmt.format(d))}</small></div>
      <div class="what">${head}${note}</div>
      <div class="right"><span class="num">${esc(eur.format(x.amount))}</span>
      <button class="icon edit" data-id="${esc(x.id)}" aria-label="Редактирай">✎</button>
      <button class="icon del" data-id="${esc(x.id)}" aria-label="Изтрий">✕</button></div></li>`;}).join('')}</ul></section>`;
  }).join('');
}

function render(){
  if(editId && !items.some(x=>x.id===editId)){ editId=null; $('form').reset(); $('fDate').value=today(); $('submit').textContent='Добави плащане'; $('cancel').hidden=true; }
  if(view!=='home' && view!=='all' && !kinds.some(k=>k.id===view)) view='home';
  const home = view==='home';
  $('home').hidden = !home; $('detail').hidden = home;
  $('back').hidden = home; $('pdf').hidden = home;
  $('title').textContent = home ? 'Моите плащания' : view==='all' ? 'Всички плащания' : kindOf(view).name;
  renderBoard();
  if(home) renderHome(); else renderDetail();
}

/* ---------- data ---------- */
let statusT = null, baseStatus = '';
function setStatus(t){ clearTimeout(statusT); $('status').textContent = t; if(t && t!==baseStatus) statusT = setTimeout(()=>{ $('status').textContent = baseStatus; }, 5000); }
function setBase(t){ baseStatus = t; setStatus(t); }
function showToast(msg, withUndo){
  $('toastMsg').textContent = msg; $('undo').style.display = withUndo?'':'none';
  $('toast').style.display='flex'; clearTimeout(toastT); toastT=setTimeout(()=>{$('toast').style.display='none'; undoItem=null;},5000);
}
const failMsg = err => err && err.code==='invalid_argument' ? 'Нямаш права да записваш тук.' : err && err.code==='quota_exceeded' ? 'Мястото за данни е запълнено.' : 'Не успях да запиша. Опитай пак.';
async function put(item){
  if(mode==='db'){ const {id,...body}=item; await col.doc(id).set(body); }
  else { const i=items.findIndex(x=>x.id===item.id); if(i<0) items.push(item); else items[i]=item; saveLocal(); render(); }
}
async function remove(id){
  if(mode==='db'){ await col.doc(id).delete(); }
  else { items = items.filter(x=>x.id!==id); saveLocal(); render(); }
}
async function saveKinds(next){
  if(mode==='db'){ await kindsDoc.set({list:next}); }
  else { kinds = next; saveLocal(); render(); }
}
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function resetForm(){
  editId=null; $('form').reset(); $('fDate').value=today();
  $('submit').textContent='Добави плащане'; $('cancel').hidden=true; $('err').style.display='none'; render();
}

$('form').addEventListener('submit', async e=>{
  e.preventDefault();
  const amount = parseAmt($('fAmt').value);
  if(!(amount>0) || !$('fDate').value){ $('err').style.display='block'; return; }
  $('err').style.display='none';
  const old = editId && items.find(x=>x.id===editId);
  const item = { id: editId||newId('p'), kind: $('fCat').value || view, date: $('fDate').value, amount: Math.round(amount*100)/100,
    note: $('fNote').value.trim(), created: old?old.created:Date.now() };
  $('submit').disabled = true;
  try{ await put(item); showToast(old?'Промените са запазени':kindOf(item.kind).name+': '+eur.format(item.amount), false); resetForm(); }
  catch(err){ setStatus(failMsg(err)); }
  finally{ $('submit').disabled=false; }
});
$('cancel').addEventListener('click', resetForm);

$('cards').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k;
  if(k==='+new'){ $('newkind').classList.add('open'); $('kName').focus(); return; }
  if(k==='+all'){ go('all'); return; }
  if(manage){
    if(items.some(x=>x.kind===k)){ setStatus('Този вид има плащания и не може да се изтрие.'); return; }
    try{ await saveKinds(kinds.filter(x=>x.id!==k)); }catch(err){ setStatus(failMsg(err)); }
    return;
  }
  go(k);
});
$('manage').addEventListener('click', ()=>{ manage=!manage; setStatus(manage?'Натисни вид без плащания, за да го изтриеш.':''); render(); });
let addingKind = false;
async function addKind(){
  const name = $('kName').value.trim(); if(!name || addingKind) return;
  if(kinds.some(k=>k.name.toLowerCase()===name.toLowerCase())){ setStatus('Такъв вид вече има.'); return; }
  const used = kinds.map(k=>k.color); const color = PALETTE.find(c=>!used.includes(c)) || PALETTE[kinds.length%PALETTE.length];
  const k = {id:newId('k'), name, color};
  addingKind = true;
  try{ await saveKinds([...kinds,k]); $('kName').value=''; $('newkind').classList.remove('open'); kinds=kinds.some(x=>x.id===k.id)?kinds:[...kinds,k]; go(k.id); }
  catch(err){ setStatus(failMsg(err)); }
  finally{ addingKind = false; }
}
$('kSave').addEventListener('click', addKind);
$('kName').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addKind(); } });
$('kCancel').addEventListener('click', ()=>{ $('newkind').classList.remove('open'); $('kName').value=''; });

$('list').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const id = b.dataset.id, item = items.find(x=>x.id===id); if(!item) return;
  if(b.classList.contains('edit')){
    editId=id; render(); $('fCat').value=item.kind; $('fDate').value=item.date; $('fAmt').value=String(item.amount).replace('.',','); $('fNote').value=item.note;
    $('submit').textContent='Запази промените'; $('cancel').hidden=false;
    $('form').scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(b.classList.contains('del')){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Изтрий?'; setTimeout(()=>{ if(b.isConnected){b.classList.remove('armed'); b.textContent='✕';} },3000); return; }
    try{ await remove(id); undoItem=item; if(editId===id) resetForm(); showToast('Изтрито: '+eur.format(item.amount), true); }
    catch(err){ setStatus('Не успях да изтрия. Опитай пак.'); }
  }
});
$('undo').addEventListener('click', async ()=>{
  if(!undoItem) return; const it=undoItem; undoItem=null; $('toast').style.display='none';
  try{ await put(it); }catch(e){ setStatus('Не успях да върна плащането.'); }
});

/* ---------- eye / password ---------- */
$('eye').addEventListener('click', ()=>{
  if(unlocked){ unlocked=false; render(); return; }
  const k = view==='home'||view==='all' ? null : kindOf(view);
  $('pinFor').textContent = 'Въведи паролата, за да видиш общата сума ' + (k ? 'за „'+k.name+'“.' : 'за всички видове.');
  $('pinIn').value=''; $('pinErr').style.display='none'; $('pin').classList.add('open'); setTimeout(()=>$('pinIn').focus(),50);
});
const closePin = () => $('pin').classList.remove('open');
$('pinCancel').addEventListener('click', closePin);
$('pin').addEventListener('click', e=>{ if(e.target===$('pin')) closePin(); });
$('pinForm').addEventListener('submit', e=>{
  e.preventDefault();
  if($('pinIn').value===PIN){ unlocked=true; closePin(); render(); }
  else { $('pinErr').style.display='block'; $('pinIn').value=''; $('pinIn').focus(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePin(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && unlocked){ unlocked=false; render(); } });

/* ---------- PDF ---------- */
function clip(ctx, text, w){
  if(ctx.measureText(text).width<=w) return text;
  while(text.length && ctx.measureText(text+'…').width>w) text=text.slice(0,-1);
  return text+'…';
}
async function buildPdf(){
  const k = view==='all' ? null : kindOf(view);
  const rows = shownItems().slice().sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  try{ const sample='Дата Сума Основание 0123456789 €'; await Promise.all([document.fonts.load('400 22px Inter',sample),document.fonts.load('600 22px Inter',sample)]); }catch(e){}
  const W=1190,H=1684,M=90,RH=44,FONT='Inter, Arial, sans-serif';
  const cols = k ? [{t:'Дата',x:M,w:190},{t:'Сума',x:M+190,w:200,r:true},{t:'Основание',x:M+430,w:W-M-(M+430)}]
                 : [{t:'Дата',x:M,w:170},{t:'Сума',x:M+170,w:180,r:true},{t:'Вид',x:M+380,w:200},{t:'Основание',x:M+590,w:W-M-(M+590)}];
  const firstTop = 300, otherTop = 150, bottom = H-140;
  const per1 = Math.floor((bottom-firstTop-RH)/RH), perN = Math.floor((bottom-otherTop-RH)/RH);
  const pages = []; let i=0; pages.push(rows.slice(0,per1)); i=per1;
  while(i<rows.length){ pages.push(rows.slice(i,i+perN)); i+=perN; }
  const total = sumOf(rows), showTotal = unlocked;
  const pdf = new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
  pages.forEach((pr,pi)=>{
    const c = document.createElement('canvas'); c.width=W; c.height=H; const x = c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.fillStyle='#141413'; x.textBaseline='middle';
    let y;
    if(pi===0){
      x.font=`600 44px ${FONT}`; x.fillText(k?'Плащания: '+k.name:'Всички плащания',M,M+20);
      x.font=`400 22px ${FONT}`; x.fillStyle='#6c6b66';
      const period = rows.length ? fmtD(rows[0].date)+' – '+fmtD(rows[rows.length-1].date) : 'няма плащания';
      x.fillText('Период: '+period+'   ·   Изготвено на '+fmtD(today()),M,M+80);
      x.fillStyle='#141413'; x.font=`600 30px ${FONT}`;
      x.fillText((showTotal?'Общо: '+eur.format(total)+'   (':'(')+rows.length+(rows.length===1?' плащане)':' плащания)'),M,M+140);
      y = firstTop;
    } else y = otherTop;
    x.fillStyle='#f1f0ea'; x.fillRect(M-10,y-RH/2,W-2*M+20,RH);
    x.fillStyle='#141413'; x.font=`600 22px ${FONT}`;
    cols.forEach(cc=>{ x.textAlign=cc.r?'right':'left'; x.fillText(cc.t,cc.r?cc.x+cc.w:cc.x,y); });
    x.font=`400 22px ${FONT}`;
    pr.forEach(r=>{
      y+=RH;
      const vals = k ? [fmtD(r.date),eur.format(r.amount),r.note||'—'] : [fmtD(r.date),eur.format(r.amount),kindOf(r.kind).name,r.note||'—'];
      cols.forEach((cc,ci)=>{ x.textAlign=cc.r?'right':'left'; x.fillText(clip(x,vals[ci],cc.w-10),cc.r?cc.x+cc.w:cc.x,y); });
      x.strokeStyle='#e3e1da'; x.lineWidth=1; x.beginPath(); x.moveTo(M-10,y+RH/2); x.lineTo(W-M+10,y+RH/2); x.stroke();
    });
    if(showTotal && pi===pages.length-1){
      y+=RH; x.strokeStyle='#141413'; x.lineWidth=2; x.beginPath(); x.moveTo(M-10,y-RH/2); x.lineTo(W-M+10,y-RH/2); x.stroke();
      x.font=`600 22px ${FONT}`; x.textAlign='left'; x.fillText('Общо',M,y);
      x.textAlign='right'; x.fillText(eur.format(total),cols[1].x+cols[1].w,y);
    }
    x.font=`400 18px ${FONT}`; x.fillStyle='#6c6b66'; x.textAlign='right';
    x.fillText('Стр. '+(pi+1)+' от '+pages.length,W-M,H-70);
    if(pi>0) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89);
  });
  return pdf.output('arraybuffer');
}
$('pdf').addEventListener('click', async ()=>{
  if(!window.jspdf){ setStatus('PDF модулът още се зарежда. Опитай пак след малко.'); return; }
  const b=$('pdf'); b.disabled=true; b.textContent='…';
  try{
    const buf = await buildPdf();
    const name = (view==='all'?'Всички плащания':'Плащания '+kindOf(view).name)+' '+fmtD(today())+'.pdf';
    if(dl){ await dl.save({filename:name, data:buf}); }
    else {
      const file = new File([buf], name, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:name}); }catch(e){ if(e && e.name==='AbortError') return; throw e; }
      } else {
        const url = URL.createObjectURL(file), a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 10000);
      }
    }
  }catch(err){
    if(!err || err.code!=='declined') setStatus(err && err.code==='host_unavailable' ? 'Това приложение не може да запише файла. Отвори линка в браузър.' : 'PDF не можа да се запише.');
  }finally{ b.disabled=false; b.textContent='PDF'; }
});

/* ---------- no zoom (iOS) ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches.length>1 || (e.scale && e.scale!==1)) e.preventDefault(); }, {passive:false});
let lastTap = 0;
document.addEventListener('touchend', e=>{ const t=Date.now(); if(t-lastTap<300 && !e.target.closest('input,select,textarea')) e.preventDefault(); lastTap=t; }, {passive:false});

/* ---------- offline ---------- */
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

/* ---------- start ---------- */
loadLocal(); route();


(async ()=>{
  try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){ dl=null; }
  render();
})();
(async ()=>{
  try{ db = window.claude && await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ mode='local'; setBase(''); return; }
  mode='db'; items = []; render(); col = db.collection('payments'); kindsDoc = db.doc('settings/kinds');
  const timer = setTimeout(()=>setBase('Няма връзка в момента — данните може да не са актуални.'),10000);
  kindsDoc.onSnapshot(snap=>{
    const l = snap.exists && snap.data().list;
    kinds = Array.isArray(l) && l.length ? l.filter(k=>k&&typeof k.id==='string'&&typeof k.name==='string').map(k=>({id:k.id,name:k.name,color:safeColor(k.color)})) : DEFAULT_KINDS.slice();
    const h = location.hash.replace('#',''); if(view==='home' && h.startsWith('vid-') && kinds.some(k=>k.id===h.slice(4))) view=h.slice(4);
    render();
  }, ()=>{});
  col.onSnapshot(snap=>{
    items = snap.docs.map(d=>clean({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(baseStatus) setBase(''); }
    render();
  }, err=>{ clearTimeout(timer); setBase('Данните не могат да се заредят сега.'); });
})();
}
